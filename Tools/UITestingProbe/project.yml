name: UITestingProbe
options:
  bundleIdPrefix: com.foscomputerservices.uitestingprobe
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
packages:
  FOSUtilities:
    path: ../..
targets:
  UITestingProbe:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: FOSUtilities
        product: FOSMVVM
  UITestingProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: UITestingProbe
      - package: FOSUtilities
        product: FOSTestingUI
      - package: FOSUtilities
        product: FOSMVVM
  UITestingProbeMac:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - package: FOSUtilities
        product: FOSMVVM
  UITestingProbeMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [MacUITests]
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "15.0"
    dependencies:
      - target: UITestingProbeMac
      - package: FOSUtilities
        product: FOSTestingUI
      - package: FOSUtilities
        product: FOSMVVM
schemes:
  UITestingProbe:
    build:
      targets:
        UITestingProbe: all
        UITestingProbeUITests: [test]
    test:
      targets: [UITestingProbeUITests]
  UITestingProbeMac:
    build:
      targets:
        UITestingProbeMac: all
        UITestingProbeMacUITests: [test]
    test:
      targets: [UITestingProbeMacUITests]

name: macOS test trial

# Branch-only trial of a macOS package-test leg (planning/stream/chore-macos-ci-test-leg.md).
# Runs every package test target through xcodebuild on the same image and Xcode as ci.yml's
# macOS legs, three times side by side, to measure run time and repeatability before the leg
# is designed into ci.yml. Removed before any pull request.
on:
  push:
    branches: [chore/macos-ci-test-leg]

jobs:
  macos_tests:
    name: macOS package tests (trial ${{ matrix.attempt }})
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: actions/checkout@v7

      - name: Record the toolchain
        run: |
          xcodebuild -version
          swift --version
          sysctl -n hw.ncpu hw.memsize

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Run package tests
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            -scheme FOSUtilities-Package \
            -destination "platform=macOS,arch=arm64" test | xcpretty

      - name: Upload the result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-tests-${{ matrix.attempt }}
          path: ${{ runner.temp }}/tests.xcresult
          if-no-files-found: ignore

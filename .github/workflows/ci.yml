name: CI

on:
  workflow_dispatch:
  pull_request:

# The macOS toolchain is PINNED, not tracked: `runs-on: macos-26` with
# `xcode-version: "26.6"` on every leg that needs Xcode.
#
# `macos-latest` + `latest-stable` stacked two moving targets. The image pool's
# ceilings differ by three minor versions (macos-15 tops out at Xcode 26.3,
# macos-26 at 26.6) and their defaults by ten (16.4 against 26.6), so the day
# GitHub re-points `macos-latest` the whole toolchain moves under us — on
# whichever pull request happens to be next, with nothing in its diff to explain
# it. That matters here beyond the usual: the SDK version is an INPUT to the
# generated Localizable overloads, and their staleness gate reads it.
#
# Bumping is a deliberate one-line pull request, red or green on its own. Keep
# both literals in step; the SDKs follow the Xcode, not the image.
#
# The one exception is sdk27_preview_build, which runs the preview image on
# purpose and explains itself where it is declared.

jobs:
  # Whether this pull request touches anything a build or a test could observe.
  # A documentation-only push otherwise spends the full matrix — over an hour of
  # runners — to prove that prose still compiles.
  #
  # An ALLOWLIST of ignorable paths, never a denylist of interesting ones: a file
  # type nobody has thought about yet counts as code and runs everything. The cost
  # of being wrong runs one way (a wasted hour) and not the other (a leg silently
  # skipped for a real change).
  #
  # Heavy jobs are SKIPPED by a condition rather than the workflow being filtered
  # out with `paths-ignore`. A filtered workflow reports nothing at all, which reads
  # as untested and — the day anything here becomes a required status check — blocks
  # the merge forever waiting for a check that will never arrive. A job skipped by a
  # condition reports as skipped, which satisfies a required check and says plainly
  # what happened.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # workflow_dispatch carries no pull request, so there is no diff to take
          # and the honest answer is to run everything.
          if [ -z "${BASE:-}" ] || [ -z "${HEAD:-}" ]; then
            echo "no pull request context; running the full matrix"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "changed files:"
          echo "$changed"

          # Any path that is not documentation makes this a code change.
          #
          # Tested for a non-empty result rather than with `grep -q`: BSD grep exits 1
          # for `-qv` on input where plain `-v` prints matches and exits 0, so the
          # `-q` form would answer correctly on the GNU grep this job runs and
          # silently invert for anyone checking it on a Mac.
          code_paths=$(printf '%s\n' "$changed" | grep -vE '(^docs/|\.md$)' || true)
          if [ -n "$code_paths" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "documentation only; the build and test legs will be skipped"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Its own job, not a step on run_tests: linting needs neither a toolchain
  # install nor a build, so it reports in under a minute instead of waiting
  # behind the matrix. Both tools are the ones CLAUDE.md documents; until now
  # nothing enforced either, which is how twenty scaffolder files reached main
  # without their license header.
  lint:
    name: Format and lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # `brew install` leaves a preinstalled older formula alone, and the
      # runner image pool has carried two SwiftFormat versions at once;
      # `brew upgrade` makes latest mean latest on every runner.
      - name: Install linters
        run: |
          brew update
          brew install swiftformat swiftlint
          brew upgrade swiftformat swiftlint

      # --lint reports without writing. `swiftformat .` is the fix.
      # fileHeader is excluded here, not in .swiftformat: its template year is
      # `{created.year}`, which SwiftFormat resolves from filesystem creation
      # dates — and a fresh checkout stamps every file with today's date, so any
      # committed 2024/2025 header "fails" on CI while passing locally. Header
      # enforcement stays local, where the dates are real.
      - name: SwiftFormat
        run: swiftformat --lint --disable fileHeader .

      - name: SwiftLint
        run: swiftlint --strict

  run_tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test Swift v${{ matrix.swift }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] #, windows-latest] #, macos-latest] -- MasOS hangs on swift build, runs fine on xcodebuild
        swift: ["6.3.2"] # match the dev/release toolchain; 6.2.1 crashed under parallel-test load (runtime bug fixed upstream)
      fail-fast: false
    steps:
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}

      - uses: actions/checkout@v2

      - name: Run Tests
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            swift build
          else
            swift test
          fi
        shell: bash

      - name: API Catalog Audit
        if: matrix.os == 'ubuntu-latest'
        run: swift scripts/api-catalog-audit.swift
        shell: bash

  # Split from run_tests (rather than an extra step there) so it runs
  # concurrently instead of after swift test — GitHub Actions only
  # parallelizes at the job level, not between steps in the same job.
  run_release_build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build (Release) Swift v${{ matrix.swift }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        swift: ["6.3.2"]
      fail-fast: false
    steps:
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}

      - uses: actions/checkout@v2

      - name: Build (Release)
        run: swift build -c release
        shell: bash

  # Ensure that compilation succeeds via xcodebuild.
  #
  # Non-macOS destinations build the FOSMVVM scheme (the Apple-platform
  # surface, transitively FOSFoundation + FOSMacros): the Vapor targets are
  # macOS/Linux-only BY DESIGN — their Vapor/Fluent/Leaf dependencies are
  # platform-conditional in Package.swift, so the package scheme can never
  # compile for device platforms (unguarded `import Vapor` with no module).
  # macOS builds the full package scheme, where Vapor is real.
  #
  # `set -o pipefail` is load-bearing: a pipeline's exit status is the LAST
  # command's (xcpretty's, always 0), and GitHub's DEFAULT shell is bash
  # WITHOUT pipefail — these legs were false-green for failing xcodebuilds
  # until it was added.
  run_xcodebuild_tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build ${{ matrix.ios_platform }} (${{ matrix.configuration }}) via Xcodebuild
    runs-on: macos-26
    strategy:
      matrix:
        ios_platform: ["macOS", "iOS", "watchOS", "tvOS", "visionOS"]
        configuration: ["Debug", "Release"]
      # Each platform's verdict is independent evidence — one red leg must
      # not cancel the others (default fail-fast hid exactly that).
      fail-fast: false

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: actions/checkout@v2

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Run ${{ matrix.ios_platform }} build
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation -derivedDataPath \
            "$PWD/.derivedData" -scheme FOSMVVM -configuration "${{ matrix.configuration }}" \
            -destination "generic/platform=${{ matrix.ios_platform }}" build | xcpretty
        if: matrix.ios_platform != 'macOS'

      # Simply cannot get macOS to work with swift test & github actions, they hang 🤷‍♂️
      - name: Run macOS build
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme FOSUtilities-Package -configuration "${{ matrix.configuration }}" \
            -destination "platform=macOS,arch=arm64,name=My Mac" build | xcpretty
        if: matrix.ios_platform == 'macOS'

  # Early warning that the framework still compiles against the NEXT major SDK,
  # before a consumer on that Xcode finds out for us.
  #
  # Runs on the `xcode-27` PREVIEW image: macOS 27.0, Xcode 27.0 (27A266a, the
  # Release Candidate) as the image's only and default Xcode, with 27.0 SDKs
  # across every Apple platform. No setup-xcode step — there is nothing to
  # select, and pinning a version the image does not carry is how this leg would
  # fail for a reason that has nothing to do with the code.
  #
  # continue-on-error: this is evidence, not a gate. A preview image can be
  # rebuilt, withdrawn or re-pointed without notice, and an SDK the project has
  # not adopted must never block a merge. Promote it to required only once the
  # SDK it builds against is one we ship for.
  #
  # NOT the whole matrix, and deliberately NOT overload_sweep_staleness: that
  # gate compares the runner's SDK versions against the stamp checked into
  # SweepCoverage.md, and a runner whose SDKs are NEWER fails by construction
  # (scripts/localizable-overload-sweep.swift — "the checked-in output is stale
  # by definition, and the gate fails there rather than skipping"). On an SDK-27
  # runner it would be red on every run with nothing wrong.
  #
  # Nor the UI-testing probe: this image carries iOS 27.0 simulators only —
  # iPhone 17/17e/18 Pro/18 Pro Max/Air — and every geometry the probe was
  # written for is already covered on the pinned legs.
  sdk27_preview_build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build ${{ matrix.ios_platform }} against SDK 27 (preview)
    runs-on: xcode-27
    continue-on-error: true
    strategy:
      matrix:
        ios_platform: ["macOS", "iOS"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Record the toolchain this leg actually got
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install xcpretty
        run: gem install xcpretty

      # Same schemes and flags as the pinned build matrix, for the same reasons:
      # the Vapor targets are macOS/Linux-only, so a device platform builds the
      # FOSMVVM scheme and macOS builds the full package scheme.
      - name: Run ${{ matrix.ios_platform }} build
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation -derivedDataPath \
            "$PWD/.derivedData" -scheme FOSMVVM -configuration Debug \
            -destination "generic/platform=${{ matrix.ios_platform }}" build | xcpretty
        if: matrix.ios_platform != 'macOS'

      - name: Run macOS build
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme FOSUtilities-Package -configuration Debug \
            -destination "platform=macOS,arch=arm64,name=My Mac" build | xcpretty
        if: matrix.ios_platform == 'macOS'

  # Fail if the checked-in generated Localizable overloads are stale relative to
  # the SDKs. --check is stamp-aware: it compares the runner's SDK versions
  # against the stamp in SweepCoverage.md and only byte-compares when all five
  # match; a version mismatch (or a missing SDK) is an informational skip
  # (exit 0), never a false drift failure. The generated output is a function
  # of ALL five SDKs (union-derived availability), so a partial regeneration
  # can never byte-match — hence all-or-nothing. LIVE on hosted runners
  # (verified 2026-07-09: macos-latest ships all five SDKs, visionOS
  # included); it skips only when a runner's SDK versions trail the stamp.
  overload_sweep_staleness:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Generated overloads staleness gate
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: actions/checkout@v2

      - name: Staleness gate
        run: swift scripts/localizable-overload-sweep.swift --check

  # The scaffolder's verification (migration design §7), on every PR (ruled
  # 2026-08-22; revisit if too draconian). Everything runs via xcodebuild:
  # swift test/build hang on macOS runners (see run_tests matrix note), and
  # the bootstrap targets are mac-host-gated so ubuntu never sees them.
  #
  # Layers, one job each (fanned out 2026-09-02: serial, they ran seventy
  # minutes — fast suite, skeletons, then four generated-app runs back to
  # back; none feeds another, so the wall clock is now the longest leg):
  #   1. Fast suite (config/tokens/emitter/consistency tests; skeletons
  #      self-skip without the env gate).
  #   2. Walking skeletons: emit each shape, run its verification doors.
  #      TEST_RUNNER_ prefix forwards the gate to the test process.
  #   3. Generation matrix: generated UI tests on real destinations — the
  #      automated BIG TEST, one leg per app shape × destination. The
  #      least-proven leg (design §7): signing and simulator behavior on
  #      hosted runners may need iteration.
  bootstrap_fast_suite:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Scaffolder fast suite
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      # The Verifier's inner xcodebuild (building the generated app) is a
      # child process, so the outer -skipMacroValidation flag never reaches
      # it; disable the fingerprint gate runner-wide instead.
      - name: Skip macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Fast suite
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme FOSUtilities-Package -destination "platform=macOS,arch=arm64,name=My Mac" \
            -only-testing:FOSMVVMBootstrapTests test | xcpretty || \
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme FOSUtilities-Package -destination "platform=macOS,arch=arm64,name=My Mac" \
            -only-testing:FOSMVVMBootstrapTests test

  bootstrap_skeletons:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Scaffolder walking skeletons
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Skip macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Walking skeletons
        env:
          TEST_RUNNER_FOSMVVM_BOOTSTRAP_SKELETONS: "1"
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme FOSUtilities-Package -destination "platform=macOS,arch=arm64,name=My Mac" \
            -only-testing:FOSMVVMBootstrapTests/IntegrationTests test

  # One leg per (app shape × destination). Each leg builds the CLI and
  # scaffolds its own app: a few minutes of build per leg buys running the
  # four legs side by side instead of one after another.
  bootstrap_generated_app_tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Generated UI tests (${{ matrix.app }}, ${{ matrix.destination }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        app: [LocalDemo, ServerDemo]
        destination: [iOS Simulator, macOS]
        include:
          - app: LocalDemo
            shape: localOnly
            bundle_id_root: com.example.localdemo
          - app: ServerDemo
            shape: clientServer
            bundle_id_root: com.example.serverdemo
          - destination: iOS Simulator
            xcode_destination: "platform=iOS Simulator,name=iPhone 17"
            signing: "CODE_SIGNING_ALLOWED=NO"
          - destination: macOS
            xcode_destination: "platform=macOS,arch=arm64,name=My Mac"
            signing: "CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual"
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Skip macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Build the scaffolder
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme fosmvvm-bootstrap -destination "platform=macOS,arch=arm64,name=My Mac" build

      - name: Generate ${{ matrix.app }}
        run: |
          set -o pipefail
          BIN="$PWD/.derivedData/Build/Products/Debug/fosmvvm-bootstrap"
          mkdir -p "$RUNNER_TEMP/matrix"
          cat > "$RUNNER_TEMP/app.json" <<CONFIG
          { "projectName": "${{ matrix.app }}", "shape": "${{ matrix.shape }}",
            "platforms": { "macOS": "14.0", "iOS": "17.0" },
            "bundleIdRoot": "${{ matrix.bundle_id_root }}", "teamId": "ABCDE12345" }
          CONFIG
          "$BIN" new --config "$RUNNER_TEMP/app.json" --output "$RUNNER_TEMP/matrix/${{ matrix.app }}"

      # CI simulators are ALWAYS the cold case: fresh boot, first install —
      # exactly the measured first-run tap-flake condition (2026-08-22).
      # Pre-booting warms the sim; -retry-tests-on-failure keeps a one-off
      # settling flake visible in logs without redding the PR, while a real
      # failure still fails both iterations. Durable fix is FOSTestingUI's
      # first-interaction settle (follow-on) — then retries are belt-and-braces.
      - name: Pre-boot iOS simulator
        if: matrix.destination == 'iOS Simulator'
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 17 (" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Generated UI tests
        run: |
          set -o pipefail
          xcrun xcodebuild -project "$RUNNER_TEMP/matrix/${{ matrix.app }}/${{ matrix.app }}.xcodeproj" \
            -scheme "${{ matrix.app }}" -destination "${{ matrix.xcode_destination }}" \
            -retry-tests-on-failure -test-iterations 2 \
            ${{ matrix.signing }} test

  # The UI-testing probe, which until now ran only by hand on a developer's
  # machine. It is where the FOSTestingUI capability contract is pinned —
  # waitForStableFrame, selectPickerItem, setText, setToggle, dismissKeyboard,
  # and the registerTestView presentation declarations — none of which a unit
  # test can reach, because the accessibility tree only exists while an app runs
  # under XCUITest. A fixture nothing automated runs is a pin that cannot fail.
  #
  # Distinct from bootstrap_generated_app_tests above: that job proves the
  # scaffolder emits an app whose generated tests pass, exercising the core
  # transport. This one proves the capabilities themselves, against the working
  # tree (the probe consumes the package from ../.., not from a release).
  probe_ui_tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Probe UI tests (${{ matrix.leg }})
    runs-on: macos-26
    strategy:
      # Each platform's verdict is independent evidence, as in the build matrix.
      fail-fast: false
      matrix:
        leg: [iOS, macOS]
        include:
          - leg: iOS
            scheme: UITestingProbe
            signing: "CODE_SIGNING_ALLOWED=NO"
          - leg: macOS
            scheme: UITestingProbeMac
            destination: "platform=macOS,arch=arm64,name=My Mac"
            signing: "CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual"

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Skip macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      # The .xcodeproj is not committed; project.yml is the source of truth.
      - name: Generate the probe project
        working-directory: Tools/UITestingProbe
        run: xcodegen generate

      # Resolve the simulator to a UDID rather than naming it on the destination.
      # A `name:` that matches devices under several installed runtimes resolves
      # to nothing, and xcodebuild then reports the failure as though no iOS
      # simulator existed at all — the destination list it prints omits them
      # entirely, which sends the reader hunting for a missing SDK.
      #
      # Pre-booting is the same cold-simulator mitigation documented on
      # bootstrap_generated_app_tests: a CI simulator is always a fresh boot and
      # a first install, which is the measured first-interaction flake condition.
      - name: Pre-boot iOS simulator
        if: matrix.leg == 'iOS'
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 17 (" | head -1 | grep -oE "[0-9A-F-]{36}")
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone 17 simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "PROBE_DESTINATION=id=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Select macOS destination
        if: matrix.leg == 'macOS'
        run: echo "PROBE_DESTINATION=${{ matrix.destination }}" >> "$GITHUB_ENV"

      # Derived data goes under RUNNER_TEMP, never inside the checkout: the repo
      # does not ignore a derived-data directory, so a path here would surface as
      # untracked output.
      #
      # `set -o pipefail` is load-bearing even with no pipe today — the legs above
      # were false-green for failing xcodebuilds until it was added, and this
      # command grows a formatter sooner or later.
      #
      # -retry-tests-on-failure with 2 iterations keeps a one-off settling flake
      # visible in the log without redding the PR; a real failure still fails both.
      - name: Run ${{ matrix.leg }} probe tests
        working-directory: Tools/UITestingProbe
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$RUNNER_TEMP/probe-deps" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$RUNNER_TEMP/probe-dd" \
            -project UITestingProbe.xcodeproj -scheme "${{ matrix.scheme }}" \
            -destination "$PROBE_DESTINATION" \
            -retry-tests-on-failure -test-iterations 2 \
            ${{ matrix.signing }} test

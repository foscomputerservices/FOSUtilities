name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  # Its own job, not a step on run_tests: linting needs neither a toolchain
  # install nor a build, so it reports in under a minute instead of waiting
  # behind the matrix. Both tools are the ones CLAUDE.md documents; until now
  # nothing enforced either, which is how twenty scaffolder files reached main
  # without their license header.
  lint:
    name: Format and lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # SwiftFormat is PINNED, not brewed: a new SwiftFormat release changes
      # what "formatted" means (0.63.0 re-indented every modifier inside an
      # `#if` block), and a brew-latest CI reds an unrelated PR the morning it
      # ships. Bump SWIFTFORMAT_VERSION here and `brew upgrade swiftformat`
      # locally together; `swiftformat .` then lands the new rules as their own
      # commit. SwiftLint stays on brew until it bites.
      - name: Install linters
        env:
          SWIFTFORMAT_VERSION: 0.63.0
        run: |
          brew install swiftlint
          curl -sSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.artifactbundle.zip"
          unzip -qo "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat/swiftformat.artifactbundle/swiftformat-$SWIFTFORMAT_VERSION-macos/bin" >> "$GITHUB_PATH"

      - name: SwiftFormat version
        run: swiftformat --version

      # --lint reports without writing. `swiftformat .` is the fix.
      # fileHeader is excluded here, not in .swiftformat: its template year is
      # `{created.year}`, which SwiftFormat resolves from filesystem creation
      # dates — and a fresh checkout stamps every file with today's date, so any
      # committed 2024/2025 header "fails" on CI while passing locally. Header
      # enforcement stays local, where the dates are real.
      - name: SwiftFormat
        run: swiftformat --lint --disable fileHeader .

      - name: SwiftLint
        run: swiftlint --strict

  run_tests:
    name: Test Swift v${{ matrix.swift }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] #, windows-latest] #, macos-latest] -- MasOS hangs on swift build, runs fine on xcodebuild
        swift: ["6.3.2"] # match the dev/release toolchain; 6.2.1 crashed under parallel-test load (runtime bug fixed upstream)
      fail-fast: false
    steps:
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}

      - uses: actions/checkout@v2

      - name: Run Tests
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            swift build
          else
            swift test
          fi
        shell: bash

      - name: API Catalog Audit
        if: matrix.os == 'ubuntu-latest'
        run: swift scripts/api-catalog-audit.swift
        shell: bash

  # Split from run_tests (rather than an extra step there) so it runs
  # concurrently instead of after swift test — GitHub Actions only
  # parallelizes at the job level, not between steps in the same job.
  run_release_build:
    name: Build (Release) Swift v${{ matrix.swift }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        swift: ["6.3.2"]
      fail-fast: false
    steps:
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}

      - uses: actions/checkout@v2

      - name: Build (Release)
        run: swift build -c release
        shell: bash

  # Ensure that compilation succeeds via xcodebuild.
  #
  # Non-macOS destinations build the FOSMVVM scheme (the Apple-platform
  # surface, transitively FOSFoundation + FOSMacros): the Vapor targets are
  # macOS/Linux-only BY DESIGN — their Vapor/Fluent/Leaf dependencies are
  # platform-conditional in Package.swift, so the package scheme can never
  # compile for device platforms (unguarded `import Vapor` with no module).
  # macOS builds the full package scheme, where Vapor is real.
  #
  # `set -o pipefail` is load-bearing: a pipeline's exit status is the LAST
  # command's (xcpretty's, always 0), and GitHub's DEFAULT shell is bash
  # WITHOUT pipefail — these legs were false-green for failing xcodebuilds
  # until it was added.
  run_xcodebuild_tests:
    name: Build ${{ matrix.ios_platform }} (${{ matrix.configuration }}) via Xcodebuild 'latest-stable'
    runs-on: macos-latest
    strategy:
      matrix:
        ios_platform: ["macOS", "iOS", "watchOS", "tvOS", "visionOS"]
        configuration: ["Debug", "Release"]
      # Each platform's verdict is independent evidence — one red leg must
      # not cancel the others (default fail-fast hid exactly that).
      fail-fast: false

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v2

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Run ${{ matrix.ios_platform }} build
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation -derivedDataPath \
            "$PWD/.derivedData" -scheme FOSMVVM -configuration "${{ matrix.configuration }}" \
            -destination "generic/platform=${{ matrix.ios_platform }}" build | xcpretty
        if: matrix.ios_platform != 'macOS'

      # Simply cannot get macOS to work with swift test & github actions, they hang 🤷‍♂️
      - name: Run macOS build
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme FOSUtilities-Package -configuration "${{ matrix.configuration }}" \
            -destination "platform=macOS,arch=arm64,name=My Mac" build | xcpretty
        if: matrix.ios_platform == 'macOS'

  # Fail if the checked-in generated Localizable overloads are stale relative to
  # the SDKs. --check is stamp-aware: it compares the runner's SDK versions
  # against the stamp in SweepCoverage.md and only byte-compares when all five
  # match; a version mismatch (or a missing SDK) is an informational skip
  # (exit 0), never a false drift failure. The generated output is a function
  # of ALL five SDKs (union-derived availability), so a partial regeneration
  # can never byte-match — hence all-or-nothing. LIVE on hosted runners
  # (verified 2026-07-09: macos-latest ships all five SDKs, visionOS
  # included); it skips only when a runner's SDK versions trail the stamp.
  overload_sweep_staleness:
    name: Generated overloads staleness gate
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v2

      - name: Staleness gate
        run: swift scripts/localizable-overload-sweep.swift --check

  # The scaffolder's verification (migration design §7), on every PR (ruled
  # 2026-08-22; revisit if too draconian). Everything runs via xcodebuild:
  # swift test/build hang on macOS runners (see run_tests matrix note), and
  # the bootstrap targets are mac-host-gated so ubuntu never sees them.
  #
  # Layers, one job each (fanned out 2026-09-02: serial, they ran seventy
  # minutes — fast suite, skeletons, then four generated-app runs back to
  # back; none feeds another, so the wall clock is now the longest leg):
  #   1. Fast suite (config/tokens/emitter/consistency tests; skeletons
  #      self-skip without the env gate).
  #   2. Walking skeletons: emit each shape, run its verification doors.
  #      TEST_RUNNER_ prefix forwards the gate to the test process.
  #   3. Generation matrix: generated UI tests on real destinations — the
  #      automated BIG TEST, one leg per app shape × destination. The
  #      least-proven leg (design §7): signing and simulator behavior on
  #      hosted runners may need iteration.
  bootstrap_fast_suite:
    name: Scaffolder fast suite
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      # The Verifier's inner xcodebuild (building the generated app) is a
      # child process, so the outer -skipMacroValidation flag never reaches
      # it; disable the fingerprint gate runner-wide instead.
      - name: Skip macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Fast suite
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme FOSUtilities-Package -destination "platform=macOS,arch=arm64,name=My Mac" \
            -only-testing:FOSMVVMBootstrapTests test | xcpretty || \
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme FOSUtilities-Package -destination "platform=macOS,arch=arm64,name=My Mac" \
            -only-testing:FOSMVVMBootstrapTests test

  bootstrap_skeletons:
    name: Scaffolder walking skeletons
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Skip macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Walking skeletons
        env:
          TEST_RUNNER_FOSMVVM_BOOTSTRAP_SKELETONS: "1"
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme FOSUtilities-Package -destination "platform=macOS,arch=arm64,name=My Mac" \
            -only-testing:FOSMVVMBootstrapTests/IntegrationTests test

  # One leg per (app shape × destination). Each leg builds the CLI and
  # scaffolds its own app: a few minutes of build per leg buys running the
  # four legs side by side instead of one after another.
  bootstrap_generated_app_tests:
    name: Generated UI tests (${{ matrix.app }}, ${{ matrix.destination }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: [LocalDemo, ServerDemo]
        destination: [iOS Simulator, macOS]
        include:
          - app: LocalDemo
            shape: localOnly
            bundle_id_root: com.example.localdemo
          - app: ServerDemo
            shape: clientServer
            bundle_id_root: com.example.serverdemo
          - destination: iOS Simulator
            xcode_destination: "platform=iOS Simulator,name=iPhone 17"
            signing: "CODE_SIGNING_ALLOWED=NO"
          - destination: macOS
            xcode_destination: "platform=macOS,arch=arm64,name=My Mac"
            signing: "CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual"
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Skip macro fingerprint validation
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - name: Build the scaffolder
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme fosmvvm-bootstrap -destination "platform=macOS,arch=arm64,name=My Mac" build

      - name: Generate ${{ matrix.app }}
        run: |
          set -o pipefail
          BIN="$PWD/.derivedData/Build/Products/Debug/fosmvvm-bootstrap"
          mkdir -p "$RUNNER_TEMP/matrix"
          cat > "$RUNNER_TEMP/app.json" <<CONFIG
          { "projectName": "${{ matrix.app }}", "shape": "${{ matrix.shape }}",
            "platforms": { "macOS": "14.0", "iOS": "17.0" },
            "bundleIdRoot": "${{ matrix.bundle_id_root }}", "teamId": "ABCDE12345" }
          CONFIG
          "$BIN" new --config "$RUNNER_TEMP/app.json" --output "$RUNNER_TEMP/matrix/${{ matrix.app }}"

      # CI simulators are ALWAYS the cold case: fresh boot, first install —
      # exactly the measured first-run tap-flake condition (2026-08-22).
      # Pre-booting warms the sim; -retry-tests-on-failure keeps a one-off
      # settling flake visible in logs without redding the PR, while a real
      # failure still fails both iterations. Durable fix is FOSTestingUI's
      # first-interaction settle (follow-on) — then retries are belt-and-braces.
      - name: Pre-boot iOS simulator
        if: matrix.destination == 'iOS Simulator'
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 17 (" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Generated UI tests
        run: |
          set -o pipefail
          xcrun xcodebuild -project "$RUNNER_TEMP/matrix/${{ matrix.app }}/${{ matrix.app }}.xcodeproj" \
            -scheme "${{ matrix.app }}" -destination "${{ matrix.xcode_destination }}" \
            -retry-tests-on-failure -test-iterations 2 \
            ${{ matrix.signing }} test

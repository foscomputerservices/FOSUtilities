name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  run_tests:
    name: Test Swift v${{ matrix.swift }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] #, windows-latest] #, macos-latest] -- MasOS hangs on swift build, runs fine on xcodebuild
        swift: ["6.3.2"] # match the dev/release toolchain; 6.2.1 crashed under parallel-test load (runtime bug fixed upstream)
      fail-fast: false
    steps:
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}

      - uses: actions/checkout@v2

      - name: Run Tests
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            swift build
          else
            swift test
          fi
        shell: bash

      - name: API Catalog Audit
        if: matrix.os == 'ubuntu-latest'
        run: swift scripts/api-catalog-audit.swift
        shell: bash

  # Split from run_tests (rather than an extra step there) so it runs
  # concurrently instead of after swift test — GitHub Actions only
  # parallelizes at the job level, not between steps in the same job.
  run_release_build:
    name: Build (Release) Swift v${{ matrix.swift }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        swift: ["6.3.2"]
      fail-fast: false
    steps:
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}

      - uses: actions/checkout@v2

      - name: Build (Release)
        run: swift build -c release
        shell: bash

  # Ensure that compilation succeeds via xcodebuild.
  #
  # Non-macOS destinations build the FOSMVVM scheme (the Apple-platform
  # surface, transitively FOSFoundation + FOSMacros): the Vapor targets are
  # macOS/Linux-only BY DESIGN — their Vapor/Fluent/Leaf dependencies are
  # platform-conditional in Package.swift, so the package scheme can never
  # compile for device platforms (unguarded `import Vapor` with no module).
  # macOS builds the full package scheme, where Vapor is real.
  #
  # `set -o pipefail` is load-bearing: a pipeline's exit status is the LAST
  # command's (xcpretty's, always 0), and GitHub's DEFAULT shell is bash
  # WITHOUT pipefail — these legs were false-green for failing xcodebuilds
  # until it was added.
  run_xcodebuild_tests:
    name: Build ${{ matrix.ios_platform }} (${{ matrix.configuration }}) via Xcodebuild 'latest-stable'
    runs-on: macos-latest
    strategy:
      matrix:
        ios_platform: ["macOS", "iOS", "watchOS", "tvOS", "visionOS"]
        configuration: ["Debug", "Release"]
      # Each platform's verdict is independent evidence — one red leg must
      # not cancel the others (default fail-fast hid exactly that).
      fail-fast: false

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v2

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Run ${{ matrix.ios_platform }} build
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation -derivedDataPath \
            "$PWD/.derivedData" -scheme FOSMVVM -configuration "${{ matrix.configuration }}" \
            -destination "generic/platform=${{ matrix.ios_platform }}" build | xcpretty
        if: matrix.ios_platform != 'macOS'

      # Simply cannot get macOS to work with swift test & github actions, they hang 🤷‍♂️
      - name: Run macOS build
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme FOSUtilities-Package -configuration "${{ matrix.configuration }}" \
            -destination "platform=macOS,arch=arm64,name=My Mac" build | xcpretty
        if: matrix.ios_platform == 'macOS'

  # Fail if the checked-in generated Localizable overloads are stale relative to
  # the SDKs. --check is stamp-aware: it compares the runner's SDK versions
  # against the stamp in SweepCoverage.md and only byte-compares when all five
  # match; a version mismatch (or a missing SDK) is an informational skip
  # (exit 0), never a false drift failure. The generated output is a function
  # of ALL five SDKs (union-derived availability), so a partial regeneration
  # can never byte-match — hence all-or-nothing. LIVE on hosted runners
  # (verified 2026-07-09: macos-latest ships all five SDKs, visionOS
  # included); it skips only when a runner's SDK versions trail the stamp.
  overload_sweep_staleness:
    name: Generated overloads staleness gate
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v2

      - name: Staleness gate
        run: swift scripts/localizable-overload-sweep.swift --check

  # The scaffolder's verification (migration design §7), on every PR (ruled
  # 2026-08-22; revisit if too draconian). Everything runs via xcodebuild:
  # swift test/build hang on macOS runners (see run_tests matrix note), and
  # the bootstrap targets are mac-host-gated so ubuntu never sees them.
  #
  # Layers:
  #   1. Fast suite (config/tokens/emitter/consistency tests; skeletons
  #      self-skip without the env gate).
  #   2. Walking skeletons: emit each shape, run its verification doors.
  #      TEST_RUNNER_ prefix forwards the gate to the test process.
  #   3. Generation matrix: generated UI tests on real destinations — the
  #      automated BIG TEST. The least-proven leg (design §7): signing and
  #      simulator behavior on hosted runners may need iteration.
  bootstrap_generation_matrix:
    name: Scaffolder fast suite + skeletons + generated-app tests
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v2

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Fast suite
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme FOSUtilities-Package -destination "platform=macOS,arch=arm64,name=My Mac" \
            -only-testing:FOSMVVMBootstrapTests test | xcpretty || \
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme FOSUtilities-Package -destination "platform=macOS,arch=arm64,name=My Mac" \
            -only-testing:FOSMVVMBootstrapTests test

      - name: Walking skeletons
        env:
          TEST_RUNNER_FOSMVVM_BOOTSTRAP_SKELETONS: "1"
        run: |
          set -o pipefail
          xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
            -skipMacroValidation -skipPackagePluginValidation \
            -derivedDataPath "$PWD/.derivedData" \
            -scheme FOSUtilities-Package -destination "platform=macOS,arch=arm64,name=My Mac" \
            -only-testing:FOSMVVMBootstrapTests/IntegrationTests test

      - name: Generate app shapes for the matrix
        run: |
          set -o pipefail
          BIN="$PWD/.derivedData/Build/Products/Debug/fosmvvm-bootstrap"
          if [ ! -x "$BIN" ]; then
            xcrun xcodebuild -IDEClonedSourcePackagesDirPathOverride="$PWD/.dependencies" \
              -skipMacroValidation -skipPackagePluginValidation \
              -derivedDataPath "$PWD/.derivedData" \
              -scheme fosmvvm-bootstrap -destination "platform=macOS,arch=arm64,name=My Mac" build
          fi
          mkdir -p "$RUNNER_TEMP/matrix"
          cat > "$RUNNER_TEMP/local.json" <<'CONFIG'
          { "projectName": "LocalDemo", "shape": "localOnly",
            "platforms": { "macOS": "14.0" },
            "bundleIdRoot": "com.example.localdemo", "teamId": "ABCDE12345" }
          CONFIG
          cat > "$RUNNER_TEMP/server.json" <<'CONFIG'
          { "projectName": "ServerDemo", "shape": "clientServer",
            "platforms": { "macOS": "14.0" },
            "bundleIdRoot": "com.example.serverdemo", "teamId": "ABCDE12345" }
          CONFIG
          "$BIN" new --config "$RUNNER_TEMP/local.json" --output "$RUNNER_TEMP/matrix/LocalDemo"
          "$BIN" new --config "$RUNNER_TEMP/server.json" --output "$RUNNER_TEMP/matrix/ServerDemo"

      - name: Generated UI tests (iOS Simulator)
        run: |
          set -o pipefail
          for APP in LocalDemo ServerDemo; do
            xcrun xcodebuild -project "$RUNNER_TEMP/matrix/$APP/$APP.xcodeproj" \
              -scheme "$APP" -destination "platform=iOS Simulator,name=iPhone 17" \
              CODE_SIGNING_ALLOWED=NO SUPPORTED_PLATFORMS="iphonesimulator macosx" test
          done

      - name: Generated UI tests (macOS)
        run: |
          set -o pipefail
          for APP in LocalDemo ServerDemo; do
            xcrun xcodebuild -project "$RUNNER_TEMP/matrix/$APP/$APP.xcodeproj" \
              -scheme "$APP" -destination "platform=macOS,arch=arm64,name=My Mac" \
              CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual test
          done
